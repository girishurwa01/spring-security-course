# =====================================================================
#  application.properties = the SETTINGS file of your app.
#  Spring Boot reads it when the app starts.
#  Each line is:   key=value      (no spaces needed around =)
#  Lines starting with # are comments (ignored).
# =====================================================================

# The name of your app (shows up in the logs)
spring.application.name=hello


# =====================================================================
#  LESSON 3 — CHOOSE YOUR OWN USERNAME AND PASSWORD
#
#  Spring Security's default user reads two settings:
#      spring.security.user.name
#      spring.security.user.password
#
#  TODO 1: On the empty line below, set the username to:  girish
#  TODO 2: On the line after it, set the password to anything you like
#          (e.g. secret123 — this is just a practice app).
#
#  Hint: copy the shape of the spring.application.name line above.
# =====================================================================

spring.security.user.name=girish
spring.security.user.password=password123